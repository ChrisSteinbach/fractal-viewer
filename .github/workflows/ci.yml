name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    # Without timeout-minutes the default is GitHub's 360min ceiling.
    # Measured real duration is ~1m34s-1m54s; 10 keeps smoke's existing
    # 5x-ish margin.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # CLAUDE.md is loaded into every session's context and silently stops
      # being loaded past 150000 characters, so the guard sits below that.
      - name: CLAUDE.md size guard
        run: |
          size=$(wc -c < CLAUDE.md)
          echo "CLAUDE.md is $size bytes"
          test "$size" -le 145000

      - name: Lint (type-check x3, ESLint, Stylelint, Prettier)
        run: npm run lint

  build:
    runs-on: ubuntu-latest
    # See lint's identical comment above — same measured margin.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Production build
        run: npm run build

  test:
    runs-on: ubuntu-latest
    # See lint's identical comment above — same measured margin.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Run tests
        # The coverage transform keeps substantially more source metadata per
        # worker than the ordinary suite. Serial execution plus the measured
        # heap margin prevents runner-contention OOMs from masquerading as a
        # missing test file while preserving the complete coverage gate.
        run: npm run test:coverage -- --maxWorkers=1
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage
          path: coverage/
          retention-days: 30

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Shared with the gpu-agreement workflow, same key: the browser
      # download changes only when playwright-core does. On a hit the
      # install step below is a pure no-op, so the steady-state browser
      # path costs no external network at all.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-

      # playwright-core (the only Playwright package here) exposes the
      # `playwright-core` bin, NOT `playwright`; using `npx playwright` would
      # auto-fetch an unpinned full package. NO --with-deps, deliberately:
      # its apt call against azure.archive.ubuntu.com hung four jobs to their
      # timeouts on one pull request, the runner image already ships the
      # browser-library closure (it ships Chrome, Chromium and Edge), and the
      # SwiftShader constraint lives in the BUNDLED BROWSER, not the OS
      # libraries. The full verdict — and what to do if a slimmed-down future
      # runner image ever makes the browser fail to launch — is on
      # gpu-agreement.yml's identical step.
      - name: Install Playwright Chromium
        run: npx playwright-core install chromium

      # scripts/webgl-smoke.mjs spawns its own `npm run dev` and tears it down.
      - name: WebGL smoke test (SwiftShader software GL)
        run: npm run smoke
