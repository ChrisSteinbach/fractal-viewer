name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    # Without timeout-minutes the default is GitHub's 360min ceiling.
    # Measured real duration is ~1m34s-1m54s; 10 keeps smoke's existing
    # 5x-ish margin.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # AGENTS.md is the canonical project-rules file. CLAUDE.md imports it,
      # and an import costs the same launch context as inline text, so moving
      # bytes between the two buys no room. Keep their combined payload below
      # the project's 145k adherence/context budget; evidence belongs in docs/
      # or its reproducing harness.
      - name: Agent instruction size guard
        run: |
          size=$(cat AGENTS.md CLAUDE.md | wc -c)
          echo "AGENTS.md + CLAUDE.md is $size bytes"
          test "$size" -le 145000

      - name: Lint (type-check x3, ESLint, Stylelint, Prettier)
        run: npm run lint

  build:
    runs-on: ubuntu-latest
    # See lint's identical comment above — same measured margin.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The shipped dependency graph only (three, workbox); dev-dep advisories
      # do not gate — they ride dependabot's weekly pass instead.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Production build
        run: npm run build

  test:
    runs-on: ubuntu-latest
    # See lint's identical comment above — same measured margin.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Run tests
        # The coverage transform keeps substantially more source metadata per
        # worker than the ordinary suite. Serial execution plus the measured
        # heap margin prevents runner-contention OOMs from masquerading as a
        # missing test file while preserving the complete coverage gate.
        run: npm run test:coverage -- --maxWorkers=1
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage
          path: coverage/
          retention-days: 30

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Shared with the gpu-agreement workflow, same key: the browser
      # download changes only when playwright-core does. On a hit the
      # install step below is a pure no-op, so the steady-state browser
      # path costs no external network at all.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-

      # playwright-core (the only Playwright package here) exposes the
      # `playwright-core` bin, NOT `playwright`; using `npx playwright` would
      # auto-fetch an unpinned full package. NO --with-deps, deliberately:
      # its apt call against azure.archive.ubuntu.com hung four jobs to their
      # timeouts on one pull request, the runner image already ships the
      # browser-library closure (it ships Chrome, Chromium and Edge), and the
      # SwiftShader constraint lives in the BUNDLED BROWSER, not the OS
      # libraries. The full verdict — and what to do if a slimmed-down future
      # runner image ever makes the browser fail to launch — is on
      # gpu-agreement.yml's identical step.
      - name: Install Playwright Chromium
        run: npx playwright-core install chromium

      # scripts/webgl-smoke.mjs spawns its own `npm run dev` and tears it down.
      - name: WebGL smoke test (SwiftShader software GL)
        run: npm run smoke

  # The panel-cleanup epic's browser half: WCAG-AA contrast for every visible
  # panel text node plus the select color-scheme/option-pair contract, in
  # Chromium AND Firefox (the owner's requirement — the two engines resolve
  # option colours differently, which is how the disabled-option regression
  # shipped in the first place). A separate job from smoke: this one needs a
  # production build and the preview server (the gate measures the built
  # bundle), while smoke spawns its own dev server. The browser cache key
  # matches smoke's, so the Firefox download is the only new network cost.
  panel-contrast:
    runs-on: ubuntu-latest
    # Measured locally: build ~40s, the gate ~90s per engine; 15 keeps a
    # generous margin for a cold browser cache.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-

      # Same no-`--with-deps` rule as smoke's step above: the runner image
      # ships the browser-library closure. If a future image stops launching
      # Firefox, `npx playwright-core install-deps firefox` is the recovery —
      # with the known hang risk recorded on gpu-agreement.yml.
      - name: Install Playwright Chromium and Firefox
        run: npx playwright-core install chromium firefox

      - run: npm run build

      - name: Panel contrast gate (Chromium + Firefox)
        run: |
          # The preview's output is redirected so the backgrounded server
          # cannot hold the step's stdout open after the gate exits.
          npm run preview >/tmp/panel-preview.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sk -o /dev/null https://localhost:4173/; then break; fi
            sleep 1
          done
          node scripts/panel-contrast.verify.mjs
