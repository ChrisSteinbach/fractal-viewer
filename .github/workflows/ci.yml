name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    # fr-vja8.8: without timeout-minutes the default is GitHub's 360min
    # ceiling. Measured real duration is ~1m34s-1m54s; 10 keeps smoke's
    # existing 5x-ish margin.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # CLAUDE.md is loaded into every session's context and silently stops
      # being loaded past 150000 characters, so the guard sits below that.
      - name: CLAUDE.md size guard
        run: |
          size=$(wc -c < CLAUDE.md)
          echo "CLAUDE.md is $size bytes"
          test "$size" -le 145000

      - name: Lint (type-check x3, ESLint, Stylelint, Prettier)
        run: npm run lint

  build:
    runs-on: ubuntu-latest
    # fr-vja8.8: see lint's identical comment above — same measured margin.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Production build
        run: npm run build

  test:
    runs-on: ubuntu-latest
    # fr-vja8.8: see lint's identical comment above — same measured margin.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Run tests
        run: npm run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage
          path: coverage/
          retention-days: 30

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Shared with the gpu-agreement workflow, same key: the browser
      # download changes only when playwright-core does. The install step
      # still runs on a hit — no-op for the browser, and it is what pulls
      # the OS libraries --with-deps adds, which apt does not cache here.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-

      # playwright-core (the only Playwright package here) exposes the
      # `playwright-core` bin, NOT `playwright`; using `npx playwright` would
      # auto-fetch an unpinned full package. --with-deps adds the browser's
      # OS libraries (SwiftShader/ANGLE ship inside the bundled Chromium).
      - name: Install Playwright Chromium + system deps
        run: npx playwright-core install --with-deps chromium

      # scripts/webgl-smoke.mjs spawns its own `npm run dev` and tears it down.
      - name: WebGL smoke test (SwiftShader software GL)
        run: npm run smoke
