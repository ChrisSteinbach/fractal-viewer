name: Deploy to GitHub Pages

# The github-pages environment's deployment branch policy allows main only
# (confirmed via the API: custom_branch_policies has exactly one entry,
# "main") — this workflow CANNOT deploy any other ref, and
# "workflow_dispatch --ref <old tag/sha>" is refused at the environment gate
# rather than at dispatch, so it looks viable until it isn't. Rollback is
# therefore: land a revert of the bad commit(s) on main, then dispatch a
# FRESH run — never "Re-run failed jobs" on an old run to get old content
# redeployed, since a re-run always rebuilds and redeploys the SAME commit
# that run was originally dispatched against (checkout pins to that run's
# github.sha), so it can only retry a transient failure on today's commit,
# never substitute yesterday's.
#
# main is protected by a ruleset (pull_request + the four required ci.yml
# checks + rebase-only), so "land a revert" means a revert BRANCH taken
# through an ordinary PR — a direct push to main is refused. That adds one
# CI wait (~2min) to a rollback, which is the trade the protection makes
# on purpose: the same gate that slows a revert by two minutes is the one
# that stops an untested commit reaching main at all. The ruleset carries
# no bypass actors; in a genuine emergency the repo admin can deactivate
# it from the repo's Rules settings, eyes open.
on:
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: read

concurrency:
  group: pages
  # false, matching GitHub's own Pages starter workflow: deploy-pages is a
  # multi-step create-and-poll against the Pages API, and hard-cancelling it
  # mid-poll risks leaving the Pages deployment stuck rather than actually
  # stopping it. Two close dispatches (double-click, impatient re-dispatch)
  # queue instead of the earlier one being killed mid-publish.
  cancel-in-progress: false

jobs:
  # Refuse missing/red main CI before spending a full GPU sweep. The
  # lint/build/test/smoke gate stays an EXACT-COMMIT question (and so keeps its
  # early post-rebase refusal); only the GPU-sweep reuse below asks about the
  # tree, because only that one is expensive enough to be worth reusing.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      swept: ${{ steps.swept.outputs.swept }}
    steps:
      # Only for scripts/gpu-ci-swept.mjs below. That script is deliberately
      # dependency-free plain JavaScript so this job stays a bare-runner
      # checkout + `gh` + preinstalled node — no setup-node, no `npm ci`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The only quality gate before this job existed was `npm run build`
      # below — a commit that compiles but fails lint or tests could reach
      # production with zero automated objection (no branch protection
      # either). This queries ci.yml's check runs for the exact dispatched
      # commit and fails fast, naming whatever is missing or not green,
      # rather than waiting for in-flight CI — a dispatch on a commit CI
      # hasn't finished with should be re-dispatched once it has, not
      # blocked here. GPU agreement follows this preflight as the gpu-full
      # job; impact-selected PR checks do not substitute for the full sweep.
      # Reads check-runs unauthenticated-equivalent (verified: this public
      # repo's check-runs endpoint returns 200 with no token at all), so no
      # extra `checks: read` permission is added beyond this job's existing
      # contents: read.
      #
      # A REBASE merge mints NEW SHAs on main, so a PR's green checks do
      # not transfer to the merged commits — a dispatch fired straight
      # after `gh pr merge --rebase` is refused here until main's own CI
      # finishes on the new tip (measured: refused at merge+14s). That
      # refusal is this gate working as designed; wait for main's CI, then
      # re-dispatch.
      - name: Require green CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          required="lint build test smoke"
          # --paginate: the default page is 30 newest-first, and every
          # dispatch of this workflow mints another check suite on the same
          # commit — enough dispatches and the REQUIRED runs (the oldest ids)
          # truncate off the first page, false-refusing a green commit and
          # amplifying with each retry.
          runs=$(gh api --paginate "repos/${{ github.repository }}/commits/$COMMIT_SHA/check-runs" --jq '.check_runs' | jq -s 'add')

          missing=""
          bad=""
          for name in $required; do
            # Latest run of this name by id — a commit that reached main via
            # both a direct push and an open PR can carry more than one.
            entry=$(jq -c --arg name "$name" '[.[] | select(.name == $name)] | max_by(.id) // empty' <<<"$runs")
            if [ -z "$entry" ]; then
              missing="$missing $name"
              continue
            fi
            status=$(jq -r '.status' <<<"$entry")
            conclusion=$(jq -r '.conclusion // "none"' <<<"$entry")
            if [ "$status" != "completed" ] || [ "$conclusion" != "success" ]; then
              bad="$bad $name($status/$conclusion)"
            fi
          done

          if [ -n "$missing" ] || [ -n "$bad" ]; then
            echo "::error::Refusing to deploy $COMMIT_SHA — missing checks:${missing:- none}; failed/pending checks:${bad:- none}"
            exit 1
          fi
          echo "ci.yml is green for $COMMIT_SHA (lint, build, test, smoke) — proceeding."

      # Does this CONTENT already carry a green full sweep? Measured on the
      # 2026-09-10 staging-ceiling merge: the same 36-shard sweep ran three
      # times on one byte-identical tree — the PR, the push-to-main run, and
      # this workflow's own reusable call — with the last two overlapping, 72
      # shard jobs and ~33 minutes each for one tree.
      #
      # --tree, not the exact-SHA question, and that is what closes the chain
      # to ONE sweep. gpu-agreement.yml's push run now skips its own sweep
      # when main's new tip shares the PR head's tree, so main's tip carries a
      # green `gpu-agreement` aggregate with `backend-smoke` SKIPPED — which
      # the exact-SHA question correctly reads as "not swept", leaving deploy
      # to sweep a second time. Tree mode asks the target first (the old
      # question, unchanged and free), then the heads of its associated PRs,
      # and finds the same twin the push run found. PR head sweeps -> push
      # skips -> deploy skips. A rebase onto a MOVED main has a tree no run
      # has seen, so it sweeps here; nobody has to work out which case they
      # are in, the tree hashes answer it.
      #
      # NO --wait HERE, deliberately. gpu-agreement.yml's push run waits up to
      # 45 minutes for a twin's IN-FLIGHT sweep rather than duplicating it,
      # and this step refuses that trade for three reasons: a dispatch is
      # manual and re-dispatchable, so "wait, then dispatch again" is already
      # the user's own choice to make; this job's timeout-minutes is 2, sized
      # for a question that is answered in seconds; and a deploy parked for
      # half an hour holds the `pages` concurrency group, which
      # cancel-in-progress: false already makes precious — the rollback flow
      # (revert, then dispatch fresh) would queue behind the parked run. A
      # dispatch whose twin sweep is still running simply sweeps, exactly as
      # before.
      - name: Reuse a full GPU sweep already green on this tree
        id: swept
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
        run: node scripts/gpu-ci-swept.mjs --tree --sha="$COMMIT_SHA"

  # Full agreement is a prerequisite for the dispatched commit's content — but
  # it is a CONTENT gate, not a release-time liveness check on the publishing
  # environment: this job runs on its own ubuntu-latest runner in a separate
  # job from `deploy`, against source and CPU oracles, and never touches the
  # built bundle or the Pages environment. Liveness ("does this content still
  # pass on today's runner image") is the nightly 03:17 UTC full sweep's job,
  # so a per-deploy re-run adds no signal the nightly does not already carry,
  # and a SwiftShader/runner-image regression is a CI signal rather than a
  # reason to block source-built bundles reaching users' real browsers.
  #
  # So this is SKIPPED only when some commit carrying this EXACT TREE already
  # has a full sweep recorded green on it: a stable `gpu-agreement` aggregate
  # green, with `backend-smoke` green beside it proving that sweep was FULL
  # rather than an independence skip (the aggregate passes on both branches;
  # only the full branch asserts smoke and every shard succeeded). The tree IS
  # the content, so a green full sweep on a twin swept THIS content — that is
  # what makes the old "a rebase merge mints a DIFFERENT SHA" refusal the
  # wrong key rather than a wrong conclusion. The candidate commits are
  # PROPOSED by GitHub's heuristic commit -> PR association and DECIDED by
  # tree equality, so a wrong proposal is simply skipped. The
  # independent-change refusal is untouched: such a result SKIPPED the GPU
  # jobs, whatever tree it sat on. Anything else — a missing output, an API
  # failure, a red or pending aggregate, a tree no run has seen — sweeps. The
  # reusable workflow still has no impact baseline on dispatch, and still
  # includes both dimensional halves.
  gpu-full:
    needs: preflight
    # != 'true', never == 'false': a missing or empty output must sweep.
    if: needs.preflight.outputs.swept != 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/gpu-agreement.yml

  deploy:
    needs: [preflight, gpu-full]
    # A bare `needs: gpu-full` would skip THIS job the moment gpu-full skips,
    # which is the trap in reusing a sweep. Admit a skipped gpu-full and
    # nothing else; never run on cancellation or a failed preflight.
    if: ${{ !cancelled() && needs.preflight.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.gpu-full.result) }}
    runs-on: ubuntu-latest
    # Load-bearing now that cancel-in-progress is false — a hung run (npm ci
    # stall, runner loss, a gh api hang in the gate step) would otherwise
    # hold the pages concurrency group for GitHub's 360min default, and the
    # rollback flow (revert + fresh dispatch) queues BEHIND the zombie.
    # Measured deploys run 34s-2min; 10 is the ci.yml margin.
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build app
        run: npm run build

      # GitHub's "Re-run failed jobs" reuses the run ID but bumps
      # github.run_attempt, so a retry after a post-upload failure re-uploads
      # a second "github-pages" artifact under the same run and fails with
      # "Artifact count is 2" (2026-08-17, run 32052676809: upload succeeded,
      # then deploy-pages hit a transient Pages-API 503 whose own error text
      # says "please re-run"; recovery was a fresh dispatch, run 32052878457,
      # 34s). Naming the artifact per attempt makes a same-run retry
      # collision-free.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist/app
          name: github-pages-${{ github.run_attempt }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

  # Post-deploy gate: scripts/live-site.verify.mjs boots the REAL deployed
  # origin in headless SwiftShader Chromium and asserts what only the live
  # host can prove — HTTP OK, app boot, the service worker's COOP/COEP
  # compensation completing, a controlling worker, no console errors.
  # Exit 0 is PASS, 1 is a FAIL verdict on the deploy, 2 is INCONCLUSIVE
  # (the CHECKING side failed: browser or network) — only 2 retries.
  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The top-level block grants pages/id-token for the deploy job; this
    # job only reads the public site, so it inherits neither.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Same cache key and install as ci.yml's smoke job (which records why
      # the bin is `playwright-core` and why NO --with-deps) — on a hit the
      # install is a no-op and both jobs share one browser cache.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium
        run: npx playwright-core install chromium

      # Up to 3 attempts; only exit 2 reruns. The default URL
      # (https://fractal-4d.com) is the published origin, so none is passed.
      - name: Verify live site
        run: |
          attempts=0
          max=3
          while :; do
            attempts=$((attempts + 1))
            echo "Attempt ${attempts}/${max}: live-site verification"
            set +e
            node scripts/live-site.verify.mjs
            code=$?
            set -e
            if [ "$code" -eq 0 ]; then
              echo "live-site verification PASS (attempt ${attempts})."
              exit 0
            fi
            if [ "$code" -ne 2 ]; then
              echo "::error::live-site verification FAIL (exit ${code}, attempt ${attempts}) — site verdict, not rerunning."
              exit "$code"
            fi
            if [ "$attempts" -ge "$max" ]; then
              echo "::error::live-site verification INCONCLUSIVE (exit 2) on all ${max} attempts — giving up."
              exit 2
            fi
            echo "exit 2 is a checking-side failure — retrying in 20s."
            sleep 20
          done
