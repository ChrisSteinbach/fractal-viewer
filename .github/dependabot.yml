version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Majors are EXCLUDED from both groups (fr-vja8.40): a major must open
    # as its own PR, one package per PR with the major in the title, so it
    # can never ride into an unattended merge inside a "9 updates" group —
    # which is exactly how jsdom 30 slipped past the majors-queue-for-review
    # rule. Excluding beats ignoring: nothing is suppressed (security majors
    # included), and there is no per-package list to drift.
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: ["minor", "patch"]
      production:
        dependency-type: production
        update-types: ["minor", "patch"]
    ignore:
      # vite-plugin-pwa's peer range trails new Vite majors; hold Vite back
      # until a release supports the next major. Check:
      # npm view vite-plugin-pwa peerDependencies
      - dependency-name: vite
        versions: [">=8.0.0"]
      # typescript-eslint trails new TypeScript majors. Check:
      # npm view typescript-eslint peerDependencies
      - dependency-name: typescript
        versions: [">=6.0.0"]
