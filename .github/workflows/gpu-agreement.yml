name: GPU agreement

# Import-graph impact, not a kernel path allowlist. Unknown/new/deleted files,
# changed imports, configuration, missing history or analysis uncertainty run
# the entire 3D + 4D group. Existing source modules outside both base/head
# closures can skip. The selector and mechanically checked roster union live
# in scripts/gpu-ci-impact.ts; policy and measurements: docs/gpu-agreement-ci.md.
# No workflow path filter: the aggregate reports even on documentation PRs.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  workflow_call:
    # Deploy calls this same sweep at its own exact commit, without a baseline.

permissions:
  contents: read

concurrency:
  # A deploy's reusable call must not cancel a PR, nightly or manual full run.
  group: gpu-agreement-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      full: ${{ steps.plan.outputs.full }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # PUSH ONLY. A rebase merge mints new SHAs on main, so this push's own
      # checks start empty — but the tree it carries is byte-identical to the
      # PR head's, whose full sweep is already green. scripts/gpu-ci-swept.mjs
      # --tree asks that CONTENT question (candidates: this commit, the heads
      # of its associated PRs, the push's `before`; tree equality decides, so a
      # rebase onto a MOVED main produces a new tree and sweeps).
      #
      # NOT pull_request: a PR's own sweep is the result being ESTABLISHED, and
      # a PR head has no swept twin to inherit from. NOT schedule or
      # workflow_dispatch: those force full on purpose, and they are where
      # environment liveness — does this content still pass on today's runner
      # image — is actually measured. NOT workflow_call either, and it needs no
      # exclusion of its own: inside a called workflow github.event_name is the
      # CALLER's event, so deploy's reusable call reports `workflow_dispatch`
      # here. Deploy asks the same tree question once, in its own preflight,
      # and skips this whole call rather than entering it to skip two jobs.
      #
      # No `pull-requests: read` is added for the association call, and none
      # may be: a reusable workflow cannot request more than its caller job
      # grants, and deploy's `gpu-full` grants `contents: read` alone. It is
      # not needed — all three endpoints this reads (commit, its pulls, its
      # check runs) answer 200 on this public repo with no token at all
      # (verified 2026-09-10), the same basis deploy.yml's preflight records
      # for check-runs. If one ever refuses, the script reports it and sweeps.
      - name: Reuse a full sweep already green on this tree
        id: swept
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
        run: node scripts/gpu-ci-swept.mjs --tree --sha="$COMMIT_SHA"

      # The reuse reaches the plan as an argument rather than a second
      # skip condition, so `full=false` stays the ONE thing the GPU jobs and
      # the stable aggregate read (the aggregate asserts both are `skipped`
      # whenever it is false), and gpu-ci-plan.json still records why in its
      # `reasons`. Built in shell from the step's outputs, never interpolated
      # into the command line.
      - name: Select agreement coverage
        id: plan
        env:
          SWEPT: ${{ steps.swept.outputs.swept }}
          SWEPT_SHA: ${{ steps.swept.outputs.swept_sha }}
        run: |
          args=""
          # Both, never just the flag: an empty sha would reach the planner as
          # `--swept=` and be refused as an unknown argument, failing selection
          # and reddening the aggregate over a reuse that should merely not
          # happen.
          if [ "$SWEPT" = true ] && [ -n "$SWEPT_SHA" ]; then
            args="--swept=$SWEPT_SHA"
          fi
          node scripts/gpu-ci-plan.mjs $args
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gpu-ci-plan
          path: gpu-ci-plan.json
          retention-days: 30

  backend-smoke:
    needs: select
    if: needs.select.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-

      # No --with-deps: ubuntu-latest already has the browser library closure.
      # Repeated apt mirror hangs were the measured reason to remove it.
      # A missing library fails promptly at launch; see docs/gpu-agreement-ci.md.
      - name: Install Playwright Chromium
        run: npx playwright-core install chromium

      - name: Compile and exercise 3D/4D plain/tiled backends
        run: npm run bench:gpu -- --chrome=bundled --swiftshader --backend-smoke --out=bench-results
      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gpu-backend-smoke
          path: bench-results/
          retention-days: 30

  agreement:
    name: gpu-agreement (shard ${{ matrix.shard }})
    needs: [select, backend-smoke]
    if: needs.select.outputs.full == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
      fail-fast: false
    # Preserve the measured 20-minute whole-shard script cap and its looser
    # 40-minute job guard. The selector partitions the actual page roster;
    # thresholds, scenario budgets and the ss=1 check remain unchanged.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-

      # No --with-deps: ubuntu-latest already has the browser library closure.
      # Repeated apt mirror hangs were the measured reason to remove it.
      # A missing library fails promptly at launch; see docs/gpu-agreement-ci.md.
      - name: Install Playwright Chromium
        run: npx playwright-core install chromium

      - name: GPU flame agreement (WebGPU kernels vs CPU oracles)
        run: npm run bench:gpu -- --chrome=bundled --swiftshader --duration=1 --shard=${{ matrix.shard }}/${{ matrix.total }} --out=bench-results
      - name: Upload bench artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gpu-bench-shard-${{ matrix.shard }}
          path: bench-results/
          retention-days: 30

  gpu-agreement:
    # Stable optional required-check name; never require dynamic shard names.
    # Existing lint/build/test/smoke protection remains unchanged.
    if: always()
    needs: [select, backend-smoke, agreement]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require the selected coverage to finish successfully
        env:
          SELECT: ${{ needs.select.result }}
          FULL: ${{ needs.select.outputs.full }}
          SMOKE: ${{ needs.backend-smoke.result }}
          AGREEMENT: ${{ needs.agreement.result }}
        run: |
          test "$SELECT" = success
          if [ "$FULL" = true ]; then
            test "$SMOKE" = success
            test "$AGREEMENT" = success
          else
            test "$FULL" = false
            test "$SMOKE" = skipped
            test "$AGREEMENT" = skipped
          fi
