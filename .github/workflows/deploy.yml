name: Deploy to GitHub Pages

# The github-pages environment's deployment branch policy allows main only
# (confirmed via the API: custom_branch_policies has exactly one entry,
# "main") — this workflow CANNOT deploy any other ref, and
# "workflow_dispatch --ref <old tag/sha>" is refused at the environment gate
# rather than at dispatch, so it looks viable until it isn't. Rollback is
# therefore: land a revert of the bad commit(s) on main, then dispatch a
# FRESH run — never "Re-run failed jobs" on an old run to get old content
# redeployed, since a re-run always rebuilds and redeploys the SAME commit
# that run was originally dispatched against (checkout pins to that run's
# github.sha), so it can only retry a transient failure on today's commit,
# never substitute yesterday's.
#
# main is protected by a ruleset (pull_request + the four required ci.yml
# checks + rebase-only), so "land a revert" means a revert BRANCH taken
# through an ordinary PR — a direct push to main is refused. That adds one
# CI wait (~2min) to a rollback, which is the trade the protection makes
# on purpose: the same gate that slows a revert by two minutes is the one
# that stops an untested commit reaching main at all. The ruleset carries
# no bypass actors; in a genuine emergency the repo admin can deactivate
# it from the repo's Rules settings, eyes open.
on:
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: read

concurrency:
  group: pages
  # false, matching GitHub's own Pages starter workflow: deploy-pages is a
  # multi-step create-and-poll against the Pages API, and hard-cancelling it
  # mid-poll risks leaving the Pages deployment stuck rather than actually
  # stopping it. Two close dispatches (double-click, impatient re-dispatch)
  # queue instead of the earlier one being killed mid-publish.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Load-bearing now that cancel-in-progress is false — a hung run (npm ci
    # stall, runner loss, a gh api hang in the gate step) would otherwise
    # hold the pages concurrency group for GitHub's 360min default, and the
    # rollback flow (revert + fresh dispatch) queues BEHIND the zombie.
    # Measured deploys run 34s-2min; 10 is the ci.yml margin.
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # The only quality gate before this job existed was `npm run build`
      # below — a commit that compiles but fails lint or tests could reach
      # production with zero automated objection (no branch protection
      # either). This queries ci.yml's check runs for the exact dispatched
      # commit and fails fast, naming whatever is missing or not green,
      # rather than waiting for in-flight CI — a dispatch on a commit CI
      # hasn't finished with should be re-dispatched once it has, not
      # blocked here. gpu-agreement.yml is deliberately NOT required: its
      # paths-ignore filter means it legitimately never runs for some
      # commits, which would make "missing" indistinguishable from "red".
      # Reads check-runs unauthenticated-equivalent (verified: this public
      # repo's check-runs endpoint returns 200 with no token at all), so no
      # extra `checks: read` permission is added beyond this job's existing
      # contents: read.
      #
      # A REBASE merge mints NEW SHAs on main, so a PR's green checks do
      # not transfer to the merged commits — a dispatch fired straight
      # after `gh pr merge --rebase` is refused here until main's own CI
      # finishes on the new tip (measured: refused at merge+14s). That
      # refusal is this gate working as designed; wait for main's CI, then
      # re-dispatch.
      - name: Require green CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          required="lint build test smoke"
          # --paginate: the default page is 30 newest-first, and every
          # dispatch of this workflow mints another check suite on the same
          # commit — enough dispatches and the REQUIRED runs (the oldest ids)
          # truncate off the first page, false-refusing a green commit and
          # amplifying with each retry.
          runs=$(gh api --paginate "repos/${{ github.repository }}/commits/$COMMIT_SHA/check-runs" --jq '.check_runs' | jq -s 'add')

          missing=""
          bad=""
          for name in $required; do
            # Latest run of this name by id — a commit that reached main via
            # both a direct push and an open PR can carry more than one.
            entry=$(jq -c --arg name "$name" '[.[] | select(.name == $name)] | max_by(.id) // empty' <<<"$runs")
            if [ -z "$entry" ]; then
              missing="$missing $name"
              continue
            fi
            status=$(jq -r '.status' <<<"$entry")
            conclusion=$(jq -r '.conclusion // "none"' <<<"$entry")
            if [ "$status" != "completed" ] || [ "$conclusion" != "success" ]; then
              bad="$bad $name($status/$conclusion)"
            fi
          done

          if [ -n "$missing" ] || [ -n "$bad" ]; then
            echo "::error::Refusing to deploy $COMMIT_SHA — missing checks:${missing:- none}; failed/pending checks:${bad:- none}"
            exit 1
          fi
          echo "ci.yml is green for $COMMIT_SHA (lint, build, test, smoke) — proceeding."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build app
        run: npm run build

      # GitHub's "Re-run failed jobs" reuses the run ID but bumps
      # github.run_attempt, so a retry after a post-upload failure re-uploads
      # a second "github-pages" artifact under the same run and fails with
      # "Artifact count is 2" (2026-08-17, run 32052676809: upload succeeded,
      # then deploy-pages hit a transient Pages-API 503 whose own error text
      # says "please re-run"; recovery was a fresh dispatch, run 32052878457,
      # 34s). Naming the artifact per attempt makes a same-run retry
      # collision-free.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist/app
          name: github-pages-${{ github.run_attempt }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
